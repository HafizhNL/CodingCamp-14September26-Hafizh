<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense &amp; Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Banner notifikasi -->

    <main class="app-layout">
      <header class="app-header">
        <!-- Bagian header dan kontrol tema -->
        <button
          id="theme-toggle"
          type="button"
          aria-label="Switch to dark mode"
          aria-pressed="false"
        >🌙 Dark</button>
        <h1 class="app-title">Expense &amp; Budget Visualizer</h1>
        <div id="balance-display" class="balance-display" aria-live="polite">$0.00</div>
      </header>

      <section class="content-area">
        <!-- Bagian daftar transaksi -->
        <section class="transactions-section" aria-labelledby="transactions-heading">
          <h2 id="transactions-heading" class="section-heading">Transactions</h2>
          <!-- Kontrol pengurutan transaksi -->
          <div class="sort-control-wrapper">
            <label for="sort-control" class="sort-control-label">Sort by:</label>
            <select id="sort-control" aria-label="Sort transactions">
              <option value="timestamp-desc">Newest first</option>
              <option value="amount-asc">Amount (low → high)</option>
              <option value="amount-desc">Amount (high → low)</option>
              <option value="category-asc">Category (A–Z)</option>
              <option value="category-desc">Category (Z–A)</option>
            </select>
          </div>
          <ul id="transaction-list" class="transaction-list" aria-label="Transaction list">
            <li class="transaction-list__empty">No transactions yet</li>
          </ul>
        </section>

        <!-- Bagian chart pengeluaran -->
        <section class="chart-section" aria-labelledby="chart-heading">
          <h2 id="chart-heading" class="section-heading">Spending by Category</h2>
          <div class="chart-container">
            <canvas id="spending-chart" role="img" aria-label="Spending distribution pie chart"></canvas>
            <div id="chart-empty-message" class="chart-empty-message">No data to display.</div>
          </div>
        </section>
      </section>

      <!-- Bagian ringkasan bulanan -->
      <section id="monthly-summary" aria-labelledby="monthly-summary-heading">
        <h2 id="monthly-summary-heading" class="section-heading">Monthly Summary</h2>
        <ul class="monthly-summary__list" aria-label="Monthly spending summary">
          <li class="monthly-summary__empty">No monthly data available</li>
        </ul>
      </section>

      <!-- Bagian form tambah transaksi -->
      <section class="form-section" aria-labelledby="form-heading">
        <h2 id="form-heading" class="section-heading">Add Transaction</h2>
        <form id="transaction-form" class="transaction-form" novalidate>
          <div class="form-field">
            <label for="item-name" class="form-label">Item Name</label>
            <input
              type="text"
              id="item-name"
              name="name"
              class="form-input"
              maxlength="100"
              autocomplete="off"
              placeholder="e.g. Lunch"
              aria-describedby="item-name-error"
            />
            <span id="item-name-error" class="form-error" aria-live="polite"></span>
          </div>

          <div class="form-field">
            <label for="item-amount" class="form-label">Amount ($)</label>
            <input
              type="number"
              id="item-amount"
              name="amount"
              class="form-input"
              min="0.01"
              max="999999999.99"
              step="0.01"
              placeholder="0.00"
              aria-describedby="item-amount-error"
            />
            <span id="item-amount-error" class="form-error" aria-live="polite"></span>
          </div>

          <div class="form-field">
            <label for="item-category" class="form-label">Category</label>
            <select
              id="item-category"
              name="category"
              class="form-select"
              aria-describedby="item-category-error"
            >
              <option value="" disabled selected>Select a category</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
            <span id="item-category-error" class="form-error" aria-live="polite"></span>
          </div>

          <button type="submit" class="form-submit">Add Transaction</button>
        </form>
      </section>
    </main>

    <!-- Library chart dan kode aplikasi -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="js/app.js"></script>
  </body>
</html>
